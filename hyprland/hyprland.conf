# Hyprland configuration
# Deployed to ~/.config/hypr/hyprland.conf via systemd.tmpfiles in
# modules/desktop.nix. Edit this file, not the symlink target.

# --- Monitors -----------------------------------------------------------
# Wildcard fallback for any monitor without its own line below.
monitor = , preferred, auto, 1
# DP-1 (AOC 27G2G8) explicitly at its real 144Hz spec: its EDID lists a
# bogus "239.96Hz" mode, and "preferred" trusts the EDID's preferred-timing
# flag — which picked that bogus mode here, silently running the monitor
# at a refresh rate it doesn't actually support. display.conf below
# normally overrides this anyway, but this is the safe cold-boot default
# if that file is ever missing/reset.
monitor = DP-1, 1920x1080@144.00Hz, auto, 1

# User-editable cursor theme (set via the Quickshell cursor picker); empty
# by default, created by systemd.tmpfiles so this source never fails.
source = ~/.config/hypr/cursor.conf

# User-set display mode/scale/transform (set via the Quickshell display
# picker) — overrides the generic "preferred" fallback above for whatever
# monitors have an explicit line in here. Empty by default.
source = ~/.config/hypr/display.conf

# --- Autostart ------------------------------------------------------------
# Polkit auth is handled by our own themed PolkitDialog inside quickshell
# (dotfiles/quickshell/PolkitDialog.qml) — hyprpolkitagent stays installed
# but unstarted as a manual emergency fallback ("hyprpolkitagent &" from a
# TTY) since only one agent can be registered at a time.
exec-once = mako
exec-once = hyprpaper
# Reapplies whatever wallpaper was last set — hyprpaper/mpvpaper start every
# session with nothing loaded, and wallpaper-set never persisted anything
# on its own (see modules/scripts/wallpaper-set.sh, wallpaper-restore.sh).
exec-once = wallpaper-restore
exec-once = quickshell

# GTK/Qt apps native-Wayland where possible, X11 fallback otherwise
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct

# --- Input ------------------------------------------------------------
input {
    kb_layout = pl
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# --- General: sharp, square, minimal -----------------------------------
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(8fbcbbff)
    col.inactive_border = rgba(333333ff)
    layout = dwindle
    resize_on_border = true
}

# Border colors set via the Quickshell Theme picker (dotfiles/quickshell/
# Theme.qml) — overrides the general{} defaults above for whatever's been
# picked. Empty by default; hypr-theme-set writes to it live.
source = ~/.config/hypr/theme.conf

# Zero rounding, no shadows/blur: sharp squared look everywhere
decoration {
    rounding = 0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# Don't warp the cursor to whatever window gets focused (e.g. clicking a
# taskbar entry) — only move it when the user actually moves the mouse.
cursor {
    no_warps = true
}

# --- Window rules ---------------------------------------------------------
# (none needed currently — the polkit dialog is a layer-shell surface via
# Quickshell's PanelWindow, not a normal toplevel, so it doesn't need a
# float/center window rule at all.)

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# --- Keybinds ------------------------------------------------------------
$mod = SUPER
$terminal = kitty
$fileManager = thunar
$launcher = rofi -show drun
$imageViewer = imv

bind = $mod, Return, exec, $terminal
bind = $mod, T, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, A, exec, $launcher
bind = $mod, D, exec, show-desktop-toggle
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, S, layoutmsg, togglesplit

# Focus movement (vim-style, plus arrow keys as the same thing)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Workspaces 1-10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse: drag/resize floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots — the "screenshot" script (region|full|window, clipboard|file|both).
# Super+Shift+S is the primary bind (this keyboard has no physical Print key) —
# it saves a file AND copies to clipboard, so it's never a silent no-op.
bind = , Print, exec, screenshot full clipboard
bind = $mod, Print, exec, screenshot region clipboard
bind = $mod SHIFT, Print, exec, screenshot region both
bind = $mod SHIFT, S, exec, screenshot region both

# Image viewer quick-launch on the screenshots folder
bind = $mod, I, exec, $imageViewer ~/Screenshots
