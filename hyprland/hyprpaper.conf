# Hyprpaper wallpaper daemon config.
# Deployed to ~/.config/hypr/hyprpaper.conf via systemd.tmpfiles in
# modules/desktop.nix. No static preload list here on purpose — wallpapers
# are set at runtime via IPC (`wallpaper-set <path>`) from the Quickshell
# wallpaper picker (dotfiles/quickshell/LeftFlyout.qml).
splash = false
ipc = true
