# Kitty terminal configuration
# Deployed to ~/.config/kitty/kitty.conf via systemd.tmpfiles in
# modules/desktop.nix.

# --- Shell: run ZSH directly, with shell integration ---
shell zsh
shell_integration enabled

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Squared, minimal window chrome ---
window_padding_width 8
window_margin_width 0
window_border_width 0
draw_minimal_borders yes
hide_window_decorations yes
confirm_os_window_close 0

# --- Tab bar: flat, square ---
tab_bar_edge          top
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       2

# --- Cursor ---
cursor_shape       block
cursor_blink_interval 0

# --- Colors ---
# Base/accent colors (background, foreground, selection, borders, tabs)
# come from the Quickshell Theme picker (dotfiles/quickshell/Theme.qml),
# via kitty-theme-set — kitty has a built-in config-file watcher (see
# `kitten __watch_conf__` in its process list) that also watches included
# files, so this picks up changes live with no restart needed.
include theme.conf

# ANSI color0-15 palette (used for terminal output — ls, git diff, etc.)
# stays fixed regardless of accent/mode: these need to stay mutually
# distinguishable hues, not track a single accent color.
color0  #0d0d0d
color8  #444444
color1  #e06c75
color9  #e06c75
color2  #98c379
color10 #98c379
color3  #e5c07b
color11 #e5c07b
color4  #61afef
color12 #61afef
color5  #c678dd
color13 #c678dd
color6  #56b6c2
color14 #56b6c2
color7  #e0e0e0
color15 #ffffff
